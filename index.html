<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>高雄市局限空間工程分布統計 互動式地圖</title>
<style>
  :root {
    --ink: #ffffff;
    --ink-2: rgba(255,255,255,.78);
    --ink-3: rgba(255,255,255,.55);
    --navy-a: #203864;
    --navy-b: #000000;
    --line: #8faadc;
    --font: "Microsoft JhengHei", "微軟正黑體", "PingFang TC", "Noto Sans TC", "Heiti TC", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: var(--font); color: var(--ink); }
  #viewport { position: fixed; inset: 0; display: grid; place-items: center; }
  #stage { position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px; transform-origin: 50% 50%; overflow: hidden; user-select: none; }

  /* 背景：深藍（地圖/各區）與夕陽（全區總覽）兩層交叉淡化 */
  .bg { position: absolute; inset: 0; transition: opacity .6s ease; }
  #bgNavy { background: linear-gradient(180deg, var(--navy-a) 0%, var(--navy-b) 100%); }
  #bgSun { background: linear-gradient(180deg, #203864 0%, #87354c 50%, #c55a11 100%); opacity: 0; }
  body[data-view="summary"] #bgSun { opacity: 1; }

  /* 地圖 */
  #map { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: visible; }
  #map .d { fill: #222a35; stroke: var(--line); stroke-width: 1.2px; vector-effect: non-scaling-stroke; cursor: pointer; }
  #map .deco { fill: #222a35; stroke: var(--line); stroke-width: 1.2px; vector-effect: non-scaling-stroke; }
  #base, #deco { transition: opacity .45s ease, transform .6s cubic-bezier(.2,.7,.2,1); transform-box: view-box; }
  #top path { display: none; pointer-events: none; stroke: var(--line); stroke-width: 1.2px; vector-effect: non-scaling-stroke;
              transform-box: view-box; transform-origin: 0 0; }
  #top path.on { display: inline; }
  #top path.icon { stroke: none; }
  body[data-view="detail"] #base, body[data-view="detail"] #deco,
  body[data-view="summary"] #base, body[data-view="summary"] #deco,
  body[data-view="cover"] #base, body[data-view="cover"] #deco,
  body[data-view="years"] #base, body[data-view="years"] #deco { opacity: 0; pointer-events: none; }

  #logo { position: absolute; cursor: pointer; transition: opacity .4s ease, transform .4s ease; }
  #logo:hover { transform: scale(1.03); }
  body:not([data-view="map"]) #logo { opacity: 0; pointer-events: none; }

  /* 區名按鈕 */
  #buttons { position: absolute; inset: 0; pointer-events: none; }
  .btn { position: absolute; display: flex; align-items: center; justify-content: center; pointer-events: auto;
         font-weight: 700; font-size: 39px; letter-spacing: 1px; color: #fff; cursor: pointer; border-radius: 3px;
         transition: opacity .35s ease, transform .45s cubic-bezier(.2,.7,.2,1); }
  .btn.lit { box-shadow: inset 0 2px 2px rgba(255,255,255,.55), inset 0 -3px 4px rgba(0,0,0,.35), 0 2px 8px rgba(0,0,0,.45); }
  body:not([data-view="map"]) .btn { opacity: 0; transform: translateX(160px); pointer-events: none; }

  #label { position: absolute; border: 2px solid #d0cece; display: none; align-items: center; justify-content: center;
           font-size: 72px; font-weight: 700; pointer-events: none; text-shadow: 0 3px 6px rgba(0,0,0,.5); }
  #label.show { display: flex; }
  body:not([data-view="map"]) #label { display: none; }

  #hint { position: absolute; left: 40px; top: 425px; width: 360px; line-height: 1.6; font-size: 22px; color: var(--ink-3); transition: opacity .4s; }
  body:not([data-view="map"]) #hint { opacity: 0; }

  /* 頁面通用 */
  section.view { position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity .35s ease; }
  body[data-view="detail"] #detail, body[data-view="summary"] #summary, body[data-view="cover"] #cover, body[data-view="years"] #years { opacity: 1; pointer-events: auto; }
  .title { position: absolute; left: 14px; top: 10px; width: 960px; font-size: 56px; font-weight: 700; padding: 4px 6px 6px;
           border-bottom: 2px solid rgba(255,255,255,.85); text-shadow: 0 2px 6px rgba(0,0,0,.35); }
  .tabs { position: absolute; left: 20px; top: 112px; display: flex; gap: 10px; }
  .tab { font: 700 24px var(--font); color: var(--ink-2); background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.25);
         padding: 8px 20px; border-radius: 999px; cursor: pointer; }
  .tab:hover { background: rgba(255,255,255,.16); color: #fff; }
  .tab.on { background: #fff; color: #1d2b4f; border-color: #fff; }
  .total { position: absolute; font-size: 44px; font-weight: 700; text-shadow: 0 2px 8px rgba(0,0,0,.6); white-space: nowrap; }
  .back { position: absolute; right: 36px; bottom: 30px; width: 128px; height: 108px; cursor: pointer; filter: drop-shadow(0 4px 6px rgba(0,0,0,.45)); transition: transform .2s; }
  .back:hover { transform: translateX(-8px); }
  .pages { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; pointer-events: none; }
  .page { position: absolute; inset: 0; pointer-events: none; }
  .page.on > .card { pointer-events: auto; }
  .page > .card { position: absolute; opacity: 0; transform: translateY(160px); transition: opacity .45s ease, transform .55s cubic-bezier(.2,.7,.2,1); }
  .page.on > .card { opacity: 1; transform: none; }
  .page.left > .card { transform: translateX(-260px); }
  .page.up > .card { transform: translateY(-200px); }

  .chartTitle { font-size: 30px; font-weight: 700; text-align: center; margin-bottom: 6px; color: #fff; }
  .chartTitle.small { font-size: 24px; color: var(--ink-2); }
  .legend { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 22px; font-size: 22px; color: var(--ink-2); margin-top: 8px; }
  .legend.cols2 { display: grid; grid-template-columns: repeat(2, auto); justify-content: center; gap: 6px 34px; }
  .legend .it { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
  .legend .sw { width: 18px; height: 18px; border-radius: 4px; flex: none; }
  .legend .n { color: #fff; font-weight: 700; margin-left: 2px; }
  .legend .it.zero { opacity: .45; }
  .nodata { position: absolute; display: flex; align-items: center; justify-content: center; font-size: 30px; color: var(--ink-3); border: 2px dashed rgba(255,255,255,.25); border-radius: 50%; }
  svg.pie path.slice { cursor: default; transition: transform .15s ease; transform-box: view-box; }
  svg.pie text { font-family: var(--font); font-weight: 700; pointer-events: none; }
  #tip { position: absolute; pointer-events: none; background: rgba(10,16,32,.94); border: 1px solid rgba(255,255,255,.3); padding: 10px 16px;
         border-radius: 8px; font-size: 24px; white-space: nowrap; opacity: 0; transition: opacity .12s; z-index: 50; }
  #tip b { font-size: 26px; }
  .bigNodata { position: absolute; left: 40px; top: 210px; width: 1420px; height: 780px; display: flex; flex-direction: column;
               align-items: center; justify-content: center; gap: 14px; font-size: 64px; font-weight: 700; color: var(--ink-2); }
  .bigNodata small { font-size: 28px; font-weight: 400; color: var(--ink-3); }

  /* 表格 */
  .tbl { border-collapse: collapse; font-size: 23px; width: 100%; }
  .tbl th { position: sticky; top: 0; background: #3b2a4a; text-align: left; font-weight: 700; padding: 10px 14px; border-bottom: 2px solid rgba(255,255,255,.7); }
  .tbl td { padding: 8px 14px; border-bottom: 1px solid rgba(255,255,255,.22); }
  .tbl td.num { text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; }
  .tbl tr:hover td { background: rgba(255,255,255,.08); }
  .scroll { overflow-y: auto; height: 100%; padding-right: 8px; }
  .scroll::-webkit-scrollbar { width: 10px; } .scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,.3); border-radius: 5px; }
  .note { display: flex; gap: 26px; font-size: 26px; margin-top: 18px; }
  .note div { background: rgba(0,0,0,.22); border: 1px solid rgba(255,255,255,.3); border-radius: 10px; padding: 12px 20px; }
  .note b { font-size: 34px; margin-left: 8px; }

  /* 封面 */
  #cover { display: flex; align-items: center; justify-content: center; cursor: pointer; }
  #cover img { position: absolute; left: 477px; top: 77px; width: 973px; height: 927px; opacity: .92; }
  #cover .t { position: absolute; left: 0; right: 0; text-align: center; font-weight: 700; text-shadow: 6px 6px 8px rgba(0,0,0,.55); }
  #cover .t1 { top: 175px; font-size: 96px; letter-spacing: 6px; }
  #cover .t2 { top: 380px; font-size: 80px; line-height: 1.25; }
  #cover .go { position: absolute; bottom: 70px; left: 0; right: 0; text-align: center; font-size: 30px; color: var(--ink-2); animation: pulse 1.8s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
  body:not([data-view="cover"]) #cover * { pointer-events: none; }


  /* 年度選擇 */
  #years { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 56px; }
  #years h1 { margin: 0; font-size: 76px; letter-spacing: 6px; text-shadow: 0 4px 10px rgba(0,0,0,.5); }
  #years .sub { margin-top: -36px; font-size: 28px; color: var(--ink-2); }
  #yearList { display: flex; flex-wrap: wrap; justify-content: center; gap: 40px; max-width: 1600px; }
  .yearCard { width: 360px; padding: 34px 30px 30px; border-radius: 18px; cursor: pointer; text-align: center;
              background: linear-gradient(180deg, rgba(255,255,255,.12), rgba(255,255,255,.04)); border: 2px solid rgba(255,255,255,.28);
              box-shadow: 0 10px 30px rgba(0,0,0,.35); transition: transform .2s, border-color .2s, background .2s; font: inherit; color: inherit; }
  .yearCard:hover, .yearCard:focus-visible { transform: translateY(-8px); border-color: #ffc000; background: linear-gradient(180deg, rgba(255,192,0,.25), rgba(237,125,49,.12)); outline: none; }
  .yearCard .y { font-size: 92px; font-weight: 700; line-height: 1; }
  .yearCard .y small { font-size: 40px; margin-left: 6px; }
  .yearCard .m { margin-top: 18px; font-size: 26px; color: var(--ink-2); line-height: 1.6; }
  .yearCard .m b { color: #fff; }
  /* 資料有疑慮：方格右上角的警告符號，滑鼠停留顯示說明 */
  .yearCard { position: relative; }
  .yearCard .flag { position: absolute; top: 14px; right: 14px; width: 44px; height: 40px; display: grid; place-items: center; cursor: help; z-index: 3; }
  .yearCard .flag svg { width: 40px; height: 36px; filter: drop-shadow(0 2px 3px rgba(0,0,0,.5)); }
  .yearCard .flagTip { position: absolute; top: 52px; right: -8px; width: 520px; padding: 16px 20px; border-radius: 12px; text-align: left;
              background: #fff8dc; color: #2a2a2a; font-size: 21px; line-height: 1.5; box-shadow: 0 12px 30px rgba(0,0,0,.5);
              opacity: 0; visibility: hidden; transition: opacity .15s; pointer-events: none; z-index: 10; }
  .yearCard .flagTip::before { content: ''; position: absolute; top: -10px; right: 24px; border: 10px solid transparent; border-top: 0; border-bottom-color: #fff8dc; }
  .yearCard .flagTip b { display: block; margin-bottom: 6px; color: #8a5a00; }
  .yearCard .flagTip ul { margin: 0; padding-left: 24px; }
  .yearCard .flagTip li { margin: 3px 0; }
  .yearCard .flag:hover + .flagTip, .yearCard .flag:focus + .flagTip { opacity: 1; visibility: visible; }
  /* 刪除：方格左上角的垃圾桶 */
  .yearCard .del { position: absolute; top: 14px; left: 14px; width: 44px; height: 44px; display: grid; place-items: center; border-radius: 10px; color: rgba(255,255,255,.6); cursor: pointer; z-index: 3; transition: background .15s, color .15s; }
  .yearCard .del svg { width: 30px; height: 30px; }
  .yearCard .del:hover, .yearCard .del:focus-visible { background: rgba(255,90,90,.22); color: #ff8a8a; outline: none; }
  body.preview .yearCard .del { display: none; }
  .yearCard .y .sfx { font-size: 40px; color: #ffc000; margin-left: 4px; }
  #delModal { position: absolute; inset: 0; z-index: 80; background: rgba(0,0,0,.6); display: grid; place-items: center; }
  #delModal[hidden] { display: none; }
  #delModal .dlg { width: 760px; background: #1d2b4a; border: 2px solid #ff6b6b; border-radius: 22px; padding: 36px 40px 32px; box-shadow: 0 24px 70px rgba(0,0,0,.7); font-size: 26px; line-height: 1.55; }
  #delModal h3 { margin: 0 0 14px; font-size: 36px; display: flex; align-items: center; gap: 14px; }
  #delModal h3 svg { width: 40px; height: 40px; color: #ff6b6b; flex: none; }
  #delModal p { margin: 0 0 12px; color: var(--ink-2); }
  #delModal p b { color: #ff8a8a; }
  #delModal label { display: block; margin-top: 18px; font-size: 22px; color: var(--ink-2); }
  #delModal input { width: 100%; margin-top: 8px; padding: 12px 16px; font: 22px monospace; color: #fff; background: rgba(0,0,0,.35); border: 1px solid rgba(255,255,255,.35); border-radius: 10px; user-select: text; }
  #delModal .hint { font-size: 19px; color: var(--ink-3); margin-top: 6px; }
  #delModal .btns { display: flex; justify-content: flex-end; gap: 18px; margin-top: 26px; }
  #delModal button { font: 700 24px var(--font); padding: 12px 30px; border-radius: 12px; cursor: pointer; border: 1px solid rgba(255,255,255,.4); background: transparent; color: #fff; }
  #delModal button:hover { background: rgba(255,255,255,.12); }
  #delModal button.danger { background: #c62828; border-color: #ff6b6b; }
  #delModal button.danger:hover { background: #e53935; }
  #delModal button:disabled { opacity: .5; cursor: default; }
  #delLog { min-height: 1.4em; margin-top: 14px; font-size: 22px; color: #ffd27a; white-space: pre-wrap; }
  .yearItem { display: flex; flex-direction: column; align-items: center; gap: 16px; }
  .yearDl { font-size: 24px; color: #ffc000; text-decoration: none; border: 1px solid rgba(255,192,0,.6); border-radius: 999px; padding: 6px 24px; display: inline-flex; align-items: center; gap: 8px; }
  .yearDl:hover, .yearDl:focus-visible { background: rgba(255,192,0,.16); color: #fff; outline: none; }
  #yearMsg { font-size: 26px; color: #ffb3b3; min-height: 1em; }
  #uploadLink { position: absolute; right: 48px; bottom: 36px; font-size: 22px; color: var(--ink-3); text-decoration: none; border-bottom: 1px dashed rgba(255,255,255,.35); }
  #uploadLink:hover { color: #fff; }
  #previewBar { position: absolute; left: 0; right: 0; bottom: 0; z-index: 60; background: #c00000; color: #fff; font-size: 24px; font-weight: 700; text-align: center; padding: 6px; display: none; }
  body.preview #previewBar { display: block; }
  #yearBadge { position: absolute; left: 584px; top: 44px; font: 700 26px var(--font); color: #fff; background: rgba(255,255,255,.1);
               border: 1px solid rgba(255,255,255,.35); border-radius: 999px; padding: 8px 22px; cursor: pointer; transition: opacity .4s, background .2s; }
  #yearBadge:hover { background: rgba(255,192,0,.3); }
  body:not([data-view="map"]) #yearBadge { opacity: 0; pointer-events: none; }
  .chip { display: inline-block; vertical-align: middle; margin-left: 18px; font-size: 26px; font-weight: 700; padding: 4px 16px;
          border-radius: 999px; background: #70ad47; color: #fff; text-shadow: none; }
  @media (prefers-reduced-motion: reduce) { * { transition-duration: 1ms !important; animation: none !important; } }
</style>
</head>
<body data-view="cover">
<div id="viewport"><div id="stage">
  <div class="bg" id="bgNavy"></div>
  <div class="bg" id="bgSun"></div>

  <svg id="map" viewBox="0 0 12192 6858" aria-label="高雄市行政區地圖">
    <defs id="defs">
      <filter id="bevel" x="-5%" y="-5%" width="110%" height="110%">
        <feGaussianBlur in="SourceAlpha" stdDeviation="25" result="b"/>
        <feSpecularLighting in="b" surfaceScale="4" specularConstant=".8" specularExponent="18" lighting-color="#fff" result="s">
          <feDistantLight azimuth="225" elevation="45"/>
        </feSpecularLighting>
        <feComposite in="s" in2="SourceAlpha" operator="in" result="s2"/>
        <feComposite in="SourceGraphic" in2="s2" operator="arithmetic" k2="1" k3=".55"/>
      </filter>
      <filter id="iconShadow" x="-40%" y="-40%" width="180%" height="180%">
        <feDropShadow dx="-190" dy="152" stdDeviation="70" flood-color="#000" flood-opacity=".55"/>
      </filter>
    </defs>
    <g id="deco"></g>
    <g id="base"></g>
    <g id="top"></g>
  </svg>

  <img id="logo" src="logo.png" alt="高雄市 Kaohsiung" title="全區總覽">
  <div id="label"></div>
  <div id="buttons"></div>
  <div id="hint">滑鼠移到區名或地圖上即可預覽<br>點一下查看該區資料<br>點左上角 Logo 看全區總覽</div>

  <section class="view" id="detail">
    <div class="title" id="dTitle"></div>
    <div class="tabs" id="dTabs"></div>
    <div class="total" id="dTotal"></div>
    <div class="pages" id="dPages"></div>
    <svg class="back" id="dBack" viewBox="0 0 128 108" role="button" aria-label="返回地圖"><path d="M0 54 L54 0 V30 H128 V78 H54 V108 Z" fill="#2f5597" stroke="#6f8fd0" stroke-width="2"/></svg>
  </section>

  <section class="view" id="summary">
    <div class="title">高雄市全區總覽</div>
    <div class="tabs" id="sTabs"></div>
    <img id="kmap" src="kaohsiung.png" alt="" style="position:absolute;left:1560px;top:33px;width:276px;height:340px;opacity:.95">
    <div class="total" id="sTotal" style="left:1060px;top:104px;font-size:40px"></div>
    <div class="pages" id="sPages"></div>
    <svg class="back" id="sBack" viewBox="0 0 128 108" role="button" aria-label="返回地圖"><path d="M0 54 L54 0 V30 H128 V78 H54 V108 Z" fill="#2f5597" stroke="#6f8fd0" stroke-width="2"/></svg>
  </section>

  <section class="view" id="years">
    <h1>選擇年度</h1>
    <div class="sub">選一個年度查看該年的局限空間工程分布</div>
    <div id="yearList"></div>
    <div id="yearMsg"></div>
    <a id="uploadLink" href="upload.html">上傳新年度資料（管理者）</a>
  </section>
  <button id="yearBadge" title="切換年度"></button>

  <section class="view" id="cover">
    <img src="emblem.png" alt="國立中正大學校徽">
    <div class="t t1">國立中正大學</div>
    <div class="t t2"><span id="coverYears">&nbsp;</span><br>高雄市局限空間工程分布統計<br>互動式地圖</div>
    <div class="go">點一下進入地圖</div>
  </section>

  <div id="delModal" hidden role="dialog" aria-modal="true" aria-labelledby="delTitle">
    <div class="dlg">
      <h3 id="delTitle"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span id="delTitleText"></span></h3>
      <p>刪除後<b>無法復原</b>：網站上這份地圖的統計資料與可下載的 PPT 都會一起移除。</p>
      <label for="delToken">GitHub 金鑰（與上傳頁使用的相同）</label>
      <input id="delToken" type="password" autocomplete="off" spellcheck="false" placeholder="github_pat_…">
      <div class="hint">金鑰只用於這次刪除，不會被儲存。</div>
      <div id="delLog" role="status"></div>
      <div class="btns"><button id="delCancel">取消</button><button id="delGo" class="danger">確定刪除</button></div>
    </div>
  </div>
  <div id="tip"></div>
  <div id="previewBar">預覽模式：這份資料尚未發布，只有你這個瀏覽器看得到</div>
</div></div>

<script>
let MAP, YEAR, YEARS = [];
/* 年度代號：114、115，或同一年的另一份地圖 115_1、115_2… */
const idYear = id => parseInt(id, 10);
const idSfx = id => { const m = String(id).match(/_(\d+)$/); return m ? +m[1] : 0; };
const idSort = (a, b) => idYear(b) - idYear(a) || idSfx(a) - idSfx(b);
const K = 1920 / 12192;               // 投影片 EMU/1000 → 畫布像素
const $ = s => document.querySelector(s);
const NS = 'http://www.w3.org/2000/svg';
const el = (tag, attrs = {}, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
const h = (tag, cls, parent, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; if (parent) parent.appendChild(e); return e; };
const px = b => ({ left: b[0] * K + 'px', top: b[1] * K + 'px', width: b[2] * K + 'px', height: b[3] * K + 'px' });

/* ---------- 舞台縮放 ---------- */
function fit() {
  const s = Math.min(innerWidth / 1920, innerHeight / 1080);
  $('#stage').style.transform = `translate(-50%,-50%) scale(${s})`;
}
addEventListener('resize', fit); fit();

/* ---------- 漸層 ---------- */
const defs = $('#defs'); const gradIds = new Map();
function gradient(f) {
  if (!f || f.t === 'none') return 'none';
  if (f.t === 'solid') return f.c;
  const key = JSON.stringify(f); if (gradIds.has(key)) return `url(#${gradIds.get(key)})`;
  const id = 'g' + gradIds.size; gradIds.set(key, id);
  let g;
  if (f.t === 'lin') {
    const a = f.ang * Math.PI / 180, c = Math.cos(a), s = Math.sin(a);
    g = el('linearGradient', { id, x1: .5 - c / 2, y1: .5 - s / 2, x2: .5 + c / 2, y2: .5 + s / 2 }, defs);
  } else g = el('radialGradient', { id, cx: .5, cy: .5, r: .7 }, defs);

    del.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.stopPropagation(); e.preventDefault(); askDelete(y); } };
    b.onclick = async () => {
      try { applyYear(await loadYear(y)); clearLit(); enterMap(); }
      catch (e) { $('#yearMsg').style.color = ''; $('#yearMsg').textContent = `無法讀取 ${idLabel(y)} 年資料`; }
    };
    loadYear(y).then(Y => {
      const n = Object.values(Y.districts).filter(d => d.total > 0).length;
      b.querySelector('.m').innerHTML = `總場次 <b>${Y.summary.total}</b> 場<br>有資料的行政區 <b>${n}</b> 區`;
      if (Array.isArray(Y.flags) && Y.flags.length) {
        const f = h('span', 'flag', b, '<svg viewBox="0 0 24 22" aria-hidden="true"><path d="M12 1.5 23 20.5H1Z" fill="#ffc000" stroke="#8a5a00" stroke-width="1.2" stroke-linejoin="round"/><path d="M12 8v6" stroke="#222" stroke-width="2.4" stroke-linecap="round"/><circle cx="12" cy="17.2" r="1.4" fill="#222"/></svg>');
        f.setAttribute('aria-label', '資料有疑慮'); f.tabIndex = -1;
        h('span', 'flagTip', b, `<b>此年度資料有以下疑慮</b><ul>${Y.flags.map(t => `<li>${esc(t)}</li>`).join('')}</ul>`);
      }
    }).catch(() => { b.querySelector('.m').textContent = '資料讀取失敗'; });
  }
}
function idLabel(y) { return idSfx(y) ? `${idYear(y)}_${idSfx(y)}` : `${idYear(y)}`; }
function coverText() {
  const ys = [...new Set(YEARS.map(idYear))].sort((a, b) => a - b);
  $('#coverYears').textContent = !ys.length ? '尚無年度資料' : ys.length === 1 ? `中華民國 ${ys[0]} 年` : `中華民國 ${ys[0]}–${ys[ys.length - 1]} 年`;
}
/* ---------- 刪除年度地圖（透過 GitHub 金鑰直接改網站的 repo） ---------- */
const GH = (() => {
  const host = location.hostname.endsWith('.github.io') ? location.hostname : 'kaohsiung-confined-space-map.github.io';
  const seg = location.pathname.split('/').filter(Boolean)[0];
  return { owner: host.split('.')[0], repo: location.hostname.endsWith('.github.io') && seg && !seg.endsWith('.html') ? seg : host };
})();
let delTarget = null;
function askDelete(y) {
  delTarget = y;
  $('#delTitleText').textContent = `確定要刪除 ${idLabel(y)} 年的地圖嗎？`;
  $('#delToken').value = ''; $('#delLog').textContent = '';
  $('#delGo').disabled = false; $('#delCancel').disabled = false;
  $('#delModal').hidden = false; $('#delToken').focus();
}
function closeDelete() { $('#delModal').hidden = true; $('#delToken').value = ''; $('#delLog').textContent = ''; delTarget = null; }
$('#delCancel').onclick = closeDelete;
$('#delModal').addEventListener('click', e => { if (e.target.id === 'delModal' && !$('#delGo').disabled) closeDelete(); });
$('#delModal').addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#delGo').disabled) closeDelete(); if (e.key === 'Enter' && e.target.id === 'delToken') $('#delGo').click(); });
async function ghApi(path, token, opt = {}) {
  return fetch(`https://api.github.com/repos/${GH.owner}/${GH.repo}/contents/${path}`, {
    ...opt, headers: { Accept: 'application/vnd.github+json', Authorization: `Bearer ${token}`, 'X-GitHub-Api-Version': '2022-11-28', ...(opt.headers || {}) },
  });
}
const b64enc = s => { const u = new TextEncoder().encode(s); let bin = ''; for (let i = 0; i < u.length; i += 0x8000) bin += String.fromCharCode(...u.subarray(i, i + 0x8000)); return btoa(bin); };
const b64dec = s => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\n/g, '')), c => c.charCodeAt(0)));
$('#delGo').onclick = async () => {
  const y = delTarget, token = $('#delToken').value.trim(), log = $('#delLog');
  if (y == null) return;
  if (!token) { log.textContent = '請先貼上 GitHub 金鑰。'; $('#delToken').focus(); return; }
  $('#delGo').disabled = true; $('#delCancel').disabled = true;
  try {
    log.textContent = '檢查金鑰權限…';
    const t = await ghApi('data/years.json?ref=main', token);
    if (t.status === 401) throw new Error('金鑰無效或已過期');
    if (t.status === 403 || t.status === 404) throw new Error('金鑰沒有這個網站的存取權限');
    if (!t.ok) throw new Error(`讀取年度清單失敗（${t.status}）`);
    const tj = await t.json(), cur = JSON.parse(b64dec(tj.content));
    const list = cur.years || [];
    // 1. 先把它從年度清單拿掉，網站就不會再去讀它
    if (list.some(v => String(v) === String(y))) {
      log.textContent = '更新年度清單…';
      const years = list.filter(v => String(v) !== String(y));
      const r = await ghApi('data/years.json', token, { method: 'PUT', body: JSON.stringify({ message: `刪除 ${idLabel(y)} 年地圖（年度清單）`, content: b64enc(JSON.stringify({ years })), sha: tj.sha, branch: 'main' }) });
      if (!r.ok) { const j = await r.json().catch(() => ({})); throw new Error(`更新年度清單失敗（${r.status}）${j.message ? '：' + j.message : ''}`); }
    }
    // 2. 刪除資料檔
    log.textContent = `刪除 data/${y}.json…`;
    const f = await ghApi(`data/${y}.json?ref=main`, token);
    if (f.ok) {
      const { sha } = await f.json();
      const r = await ghApi(`data/${y}.json`, token, { method: 'DELETE', body: JSON.stringify({ message: `刪除 ${idLabel(y)} 年地圖（統計資料）`, sha, branch: 'main' }) });
      if (!r.ok) { const j = await r.json().catch(() => ({})); throw new Error(`刪除資料檔失敗（${r.status}）${j.message ? '：' + j.message : ''}`); }
    } else if (f.status !== 404) throw new Error(`讀取資料檔失敗（${f.status}）`);
    YEARS = YEARS.filter(v => String(v) !== String(y)); delete yearCache[y];
    coverText(); closeDelete(); showYears();
    $('#yearMsg').style.color = '#9be07a';
    $('#yearMsg').textContent = `已刪除 ${idLabel(y)} 年地圖。GitHub 大約需要 1 分鐘更新網站，在那之前重新整理可能還會暫時看到它。`;
  } catch (e) {
    log.textContent = '刪除失敗：' + e.message;
    $('#delGo').disabled = false; $('#delCancel').disabled = false;
  }
};
(async function init() {
  try {
    let preview = null;
    if (location.hash === '#preview') { try { preview = JSON.parse(sessionStorage.getItem('kmapPreview')); } catch (e) {} }
    if (preview) {
      MAP = await getJSON('map.json'); YEARS = [preview.year]; yearCache[preview.year] = Object.assign(preview, { id: preview.year });
      document.body.classList.add('preview'); $('#uploadLink').style.display = 'none';
    } else [MAP, { years: YEARS }] = await Promise.all([getJSON('map.json'), getJSON('data/years.json')]);
    YEARS.sort(idSort);
    coverText();
    setupMap();
  } catch (e) {
    $('#coverYears').textContent = '資料讀取失敗，請重新整理';
  }
})();
</script>
